<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Story ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Press Start 2P',cursive;
background:#070b1f;
overflow:hidden;
color:white;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.container{
width:100%;
max-width:1200px;
padding:20px;
}

.scene-card{
width:100%;
height:85vh;
border:4px solid #ff7fb8;
border-radius:16px;
overflow:hidden;
position:relative;
background:#111;
box-shadow:0 0 30px rgba(255,105,180,.4);
}

.scene{
position:absolute;
inset:0;
opacity:0;
transform:scale(1.03);
transition:1s;
pointer-events:none;
}

.scene.active{
opacity:1;
transform:scale(1);
pointer-events:auto;
}

.bg{
position:absolute;
inset:0;
}

.title{
position:absolute;
top:25px;
left:50%;
transform:translateX(-50%);
font-size:20px;
color:#fff;
text-shadow:3px 3px #ff4fa3;
text-align:center;
z-index:5;
}

.city{
position:absolute;
bottom:120px;
width:100%;
height:180px;
background:
linear-gradient(to top,#111 60%,transparent 60%);
}

.city:before{
content:"";
position:absolute;
bottom:0;
width:100%;
height:100%;
background:
repeating-linear-gradient(
to right,
#1f223f 0 50px,
#2e3055 50px 100px
);
clip-path:polygon(
0% 100%,0% 40%,
8% 40%,8% 70%,
15% 70%,15% 25%,
23% 25%,23% 80%,
30% 80%,30% 30%,
40% 30%,40% 100%,
100% 100%
);
}

.character{
position:absolute;
bottom:140px;
width:80px;
height:120px;
border-radius:10px;
animation:bob 2s infinite ease-in-out;
}

.boy{
left:35%;
background:#111;
}

.girl{
right:35%;
background:#ff8ebc;
}

.character:before{
content:"";
position:absolute;
width:60px;
height:60px;
background:#222;
border-radius:50%;
top:-40px;
left:10px;
}

.girl:before{
background:#222;
}

@keyframes bob{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-8px);}
}

.dialogue{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:90%;
background:rgba(0,0,20,.85);
border:3px solid #fff;
padding:18px;
font-size:11px;
line-height:1.8;
z-index:20;
}

.controls{
margin-top:20px;
display:flex;
justify-content:center;
gap:20px;
}

button{
font-family:'Press Start 2P';
padding:12px 22px;
background:#ff6ea9;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-3px);
background:#ff4e98;
}

.heart{
position:absolute;
font-size:22px;
animation:floatHeart linear infinite;
opacity:.8;
}

@keyframes floatHeart{
0%{
transform:translateY(30px);
opacity:0;
}
30%{
opacity:1;
}
100%{
transform:translateY(-400px);
opacity:0;
}
}

.star{
position:absolute;
width:4px;
height:4px;
background:white;
animation:twinkle 2s infinite;
}

@keyframes twinkle{
50%{
opacity:.2;
}
}

.endText{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
z-index:10;
}

.endText h1{
font-size:42px;
color:#ff8dc1;
margin-bottom:30px;
}

.endText p{
font-size:14px;
line-height:2;
}

.message{
margin-top:20px;
background:rgba(255,255,255,.12);
padding:20px;
border-radius:12px;
font-size:11px;
line-height:2;
}

@media(max-width:768px){

.title{
font-size:14px;
}

.character{
width:60px;
height:95px;
}

.dialogue{
font-size:8px;
}

.endText h1{
font-size:24px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="scene-card" id="sceneContainer"></div>

<div class="controls">
<button onclick="previousScene()">◀ Previous</button>
<button onclick="nextScene()">Next ▶</button>
</div>

</div>

<script>

const scenes = [

{
title:"1. Friend Request",
bg:"linear-gradient(#10184a,#793ea7,#ff8dc1)",
text:"A simple mutual friend request started it all."
},

{
title:"2. Started Talking",
bg:"linear-gradient(#0d1c44,#374785,#ff9ecf)",
text:"One conversation became many. We became part of each other's daily life."
},

{
title:"3. College Records",
bg:"linear-gradient(#2b234f,#5e4b8a,#d7b3ff)",
text:"Helping with college records turned into supporting each other through everything."
},

{
title:"4. Best Friends",
bg:"linear-gradient(#4477aa,#88cfff,#ffd6ec)",
text:"We became best friends and each other's routine."
},

{
title:"5. Misunderstandings",
bg:"linear-gradient(#1b2440,#42577c,#8e9db7)",
text:"There were misunderstandings, but somehow we always stayed together."
},

{
title:"6. Falling In Love",
bg:"linear-gradient(#5e3d6f,#ff8cab,#ffcf91)",
text:"Somewhere between friendship and forever, we fell in love."
},

{
title:"7. February 1, 2021",
bg:"linear-gradient(#1d2554,#784ba0,#ff9ecf)",
text:"You confessed your love on February 1, 2021... and I said YES ❤️"
},

{
title:"8. Ukraine",
bg:"linear-gradient(#4da0ff,#90d8ff,#ffffff)",
text:"You left for medical studies. Distance arrived, but love stayed."
},

{
title:"9. Back Home",
bg:"linear-gradient(#112233,#3f4b6b,#f9b17a)",
text:"Life had unexpected turns, but we faced them together."
},

{
title:"10. Uzbekistan",
bg:"linear-gradient(#132743,#3e7cb1,#8fd3fe)",
text:"You came to Uzbekistan. New places, new memories, same us."
},

{
title:"11. Long Distance",
bg:"linear-gradient(#1c1f4a,#3c2f80,#ff9dcf)",
text:"Long distance wasn't easy, but our bond remained strong."
},

{
title:"12. Future Together",
bg:"linear-gradient(#543864,#ff8fab,#ffd6a5)",
text:"Through every phase, one thing stayed constant — us."
},

{
title:"13. Happy Birthday ❤️",
bg:"linear-gradient(#3b185f,#9c27b0,#ff9ecf)",
text:"Happy Birthday Mr. C ❤️ You are strong, kind and loved beyond words."
},

{
title:"THE END",
bg:"linear-gradient(#050816,#101d42,#ff7eb3)",
text:"Thank you for watching! ❤️"
}

];

const container = document.getElementById("sceneContainer");

let current = 0;

function createStars(scene){

for(let i=0;i<35;i++){

const star=document.createElement("div");
star.className="star";

star.style.left=Math.random()*100+"%";
star.style.top=Math.random()*70+"%";
star.style.animationDelay=Math.random()*2+"s";

scene.appendChild(star);

}

}

function createHearts(scene){

for(let i=0;i<12;i++){

const h=document.createElement("div");
h.className="heart";
h.innerHTML="❤";

h.style.left=Math.random()*100+"%";
h.style.bottom="-50px";
h.style.animationDuration=(4+Math.random()*4)+"s";
h.style.animationDelay=Math.random()*4+"s";

scene.appendChild(h);

}

}

function buildScenes(){

scenes.forEach((s,index)=>{

const scene=document.createElement("div");
scene.className="scene";

if(index===0)
scene.classList.add("active");

scene.innerHTML=`

<div class="bg" style="background:${s.bg};"></div>

<div class="title">${s.title}</div>

${index===13 ? `
<div class="endText">
<h1>THE END ❤️</h1>
<p>But our story goes on...</p>

<div class="message">
Thank you for watching! ❤️<br><br>
May every chapter ahead be filled with love,
laughter, adventures and beautiful memories.
</div>
</div>
`
:
`
<div class="city"></div>

<div class="character boy"></div>
<div class="character girl"></div>

<div class="dialogue">${s.text}</div>
`
}

`;

createStars(scene);

if(index!==13)
createHearts(scene);

container.appendChild(scene);

});

}

buildScenes();

const sceneElements=document.querySelectorAll(".scene");

function showScene(index){

sceneElements.forEach(scene=>{
scene.classList.remove("active");
});

sceneElements[index].classList.add("active");

}

function nextScene(){

current++;

if(current>=sceneElements.length)
current=0;

showScene(current);

}

function previousScene(){

current--;

if(current<0)
current=sceneElements.length-1;

showScene(current);

}

setInterval(()=>{

nextScene();

},8000);

</script>

</body>
</html>
